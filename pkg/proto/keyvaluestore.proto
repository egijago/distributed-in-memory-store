syntax = "proto3";
option go_package = "pkg/proto/auto-generated";
package keyvaluestore;

service KeyValueStore {
  rpc Set (SetRequest) returns (SetResponse) {}
  rpc Get (GetRequest) returns (GetResponse) {}
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse) {}
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {
  string status = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string data = 3;
}

message AppendEntriesRequest {
  int64 term = 1;                 // Leader's term
  int64 leader_id = 2;            // Leader's ID
  int64 prev_log_index = 3;       // Previous Entry Log Index
  int64 prev_log_term = 4;        // Previous Entry Log Term
  repeated LogEntry entries = 5;  // List of Entries
  int64 leader_commit = 6;        // Leader's Commit Index
}

message AppendEntriesResponse {
  int64 term = 1;                 // Current Term (For Leader to Update Itself)
  bool success = 2;               // True if Follower Contained Prev Log Index & Prev Log Term
}
