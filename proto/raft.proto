syntax = "proto3";

option go_package = "proto.pb";

package raft;

service RaftService {
    rpc AppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesResponse);
    rpc RequestVote(RaftRequestVoteRequest) returns (RaftRequestVoteResponse);
    rpc ApplyMembership(RaftApplyMembershipRequest) returns (RaftApplyMembershipResponse);
    rpc PrepareAddMember(RaftPrepareAddMemberRequest) returns (RaftPrepareAddMemberResponse);
    rpc CommitAddMember(RaftCommitAddMemberRequest) returns (RaftCommitAddMemberResponse);
    rpc State(RaftStateRequest) returns (RaftStateResponse);
}

message RaftAppendEntriesRequest {
    int32 term = 1;
    int32 leaderId = 2;
    int32 prevLogIndex = 3;
    int32 prevLogTerm = 4;
    repeated Log entries = 5;
    int32 leaderCommit = 6;
}

message RaftAppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
}

message RaftRequestVoteRequest {
    int32 term = 1;
    int32 candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

message RaftRequestVoteResponse {
    int32 term = 1;
    bool voteGranted = 2;
}

message RaftApplyMembershipRequest {
    Address address = 1;
}

message RaftApplyMembershipResponse {
    int32 id = 1;
    repeated Address members = 2;
    int32 term = 3;
    bool success = 4;

}

message Log {
    int32 index = 1;
    string command = 2;
    int32 term = 3;
}

message Address {
    string host = 1;
    string port = 2;
}

message RaftPrepareAddMemberRequest {
    int32 term = 1;
    int32 leaderId = 2;
}

message RaftPrepareAddMemberResponse {
    int32 term = 1;
    bool success = 2;
}

message RaftCommitAddMemberRequest {
    int32 term = 1;
    int32 leaderId = 2;
    bool commit = 3;
    Address address = 4;
}

message RaftCommitAddMemberResponse {
    int32 term = 1;
    bool success = 2;
}

message RaftStateRequest {
}

message RaftStateResponse {
    repeated string state = 1;
}
