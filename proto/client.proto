syntax = "proto3";

option go_package = "proto.pb";

package client;

service ClientService {
    rpc Ping(ClientPingRequest) returns (ClientPingResponse);
    rpc Get(ClientGetRequest) returns (ClientGetResponse);
    rpc Set(ClientSetRequest) returns (ClientSetResponse);
    rpc Strln(ClientStrlnRequest) returns (ClientStrlnResponse);
    rpc Del (ClientDelRequest) returns (ClientDelResponse);
    rpc Append (ClientAppendRequest) returns (ClientAppendResponse);
    rpc ReqLog (ClientRequestLogRequest) returns (ClientRequestLogResponse);
}

message ClientPingRequest {
    string message = 1; 
}

message ClientPingResponse {
    string message = 1;
}

message ClientGetRequest {
    string key = 1;
}

message ClientGetResponse {
    string value = 1;
    bool success = 2;
    string leaderPort = 3;
}

message ClientSetRequest {
    string key = 1;
    string value = 2;
}

message ClientSetResponse {
    bool success = 1;
    string leaderPort = 2;
}

message ClientStrlnRequest {
    string key = 1;
}

message ClientStrlnResponse {
    int32 length = 1;
    bool success = 2;
    string leaderPort = 3;
}

message ClientDelRequest {
    string key = 1;
}

message ClientDelResponse {
    string value = 1;
    bool success = 2;
    string leaderPort = 3;
}

message ClientAppendRequest {
    string key = 1;
    string value = 2;
}

message ClientAppendResponse {
    string value = 1;
    bool success = 2;
    string leaderPort = 3;
}

message ClientRequestLogRequest {}

message ClientRequestLogResponse {
    string value = 1;
    bool success = 2;
    string leaderPort = 3;
}