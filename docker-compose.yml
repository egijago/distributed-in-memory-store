version: '3.8'

services:
  service0:
    build: .
    ports:
      - "8000:8000"
      - "7000:7000"
    command: ["--grpc_port=8000", "--grpc_web_port=7000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service0"]

  service1:
    build: .
    depends_on:
      - service0
    ports:
      - "8001:8001"
      - "7001:7001"
    command: ["--grpc_port=8001", "--grpc_web_port=7001", "--master_port=8000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service1", "--master_host=service0"]

  service2:
    build: .
    depends_on:
      - service0
    ports:
      - "8002:8002"
      - "7002:7002"
    command: ["--grpc_port=8002", "--grpc_web_port=7002", "--master_port=8000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service2", "--master_host=service0"]

  service3:
    build: .
    depends_on:
      - service0
    ports:
      - "8003:8003"
      - "7003:7003"
    command: ["--grpc_port=8003", "--grpc_web_port=7003", "--master_port=8000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service3", "--master_host=service0"]

  service4:
    build: .
    depends_on:
      - service0
    ports:
      - "8004:8004"
      - "7004:7004"
    command: ["--grpc_port=8004", "--grpc_web_port=7004", "--master_port=8000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service4", "--master_host=service0"]

  service5:
    build: .
    depends_on:
      - service0
    ports:
      - "8005:8005"
      - "7005:7005"
    command: ["--grpc_port=8005", "--grpc_web_port=7005", "--master_port=8000", "--et=1000", "--hi=2000", "--hrto=2000", "--ht=4000", "--hts=2000", "--host=service5", "--master_host=service0"]
